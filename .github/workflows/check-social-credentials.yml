# Check the LinkedIn and Bluesky credentials in the `social` environment,
# without posting and without printing a secret.
#
# Run by hand from the Actions tab when a post fails at sign-in. It targets the
# `social` environment and reads the same secrets as social-post.yml. The run
# summary lists each value with ✅ or ❌ and what to replace
# (scripts/check-social-credentials.py). The job fails when any check fails.
#
# SHA-pinned actions per CLAUDE.md §2.
name: Check the LinkedIn and Bluesky credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the credentials
    runs-on: ubuntu-latest
    environment: social
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Check each credential
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: python3 scripts/check-social-credentials.py
