# Scheduled-workflow failure alarm (issue #56).
#
# The site's data freshness rides on unattended cron workflows (the
# Indico sync, the board-bios sync, the daily rebuild, the daily roadmap
# refresh) plus the on-push deploy. A failed run
# used to be discoverable only by reading the Actions tab, so the
# programme could quietly go stale. This workflow turns any failure
# into a tracking issue the maintainer actually sees.
#
# Mechanics: `workflow_run` fires when a listed workflow completes (it
# only triggers for runs on the default branch, which is exactly the
# scheduled/deploy population). It does not fire for a run another
# workflow started with its GITHUB_TOKEN, so every listed workflow must be
# started by push, schedule or a person, never dispatched by a bot (#1755).
# On a failure it opens an issue titled after the failed workflow, or
# comments on the existing open one so repeat failures thread instead of
# spamming. Issues carry
# the `automated` + `bug` labels and the "Backlog — Under watch"
# milestone (rule §10: no open issue without a milestone), and are
# assigned to the maintainer accounts so the failure arrives as a
# notification. Close the issue once the underlying cause is fixed.
#
# No third-party actions, so nothing to SHA-pin: the steps use the
# preinstalled gh CLI with the runner's GITHUB_TOKEN.
name: Workflow failure alarm

on:
  workflow_run:
    workflows:
      - Build and deploy site
      - Sync events from Indico
      - Sync board bios from Google Form
      - Sync NetSec directory links
      - Sync member ORCID works
      - Sync publication matches
      - Refresh roadmap surfaces
      - Abstract coverage report
    types: [completed]

permissions:
  issues: write

jobs:
  alarm:
    name: Open or update the alarm issue
    # timed_out and startup_failure (a broken workflow file) are failures
    # too. cancelled is not: the deploy's concurrency group cancels on purpose.
    if: contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: File or thread the failure
        env:
          GH_TOKEN: ${{ github.token }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_STARTED: ${{ github.event.workflow_run.run_started_at }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          # Maintainer accounts. Comma-separated, as `gh --assignee` takes them.
          ALARM_ASSIGNEES: EISSeuropa,APB-LDN
        run: |
          set -euo pipefail
          title="CI alarm: \"${WF_NAME}\" failed"
          body="The **${WF_NAME}** workflow failed.

          - Run: ${RUN_URL} (attempt ${RUN_ATTEMPT})
          - Started: ${RUN_STARTED}

          Filed automatically by the failure-alarm workflow (#56). Close this issue once the underlying cause is fixed; a later failure of the same workflow reopens the conversation as a fresh issue."

          # Exact title match in jq. A quoted `--search` broke on the quotes
          # inside the title and opened a fresh issue each time (#1760).
          export title
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label automated --limit 100 \
            --json number,title \
            --jq 'map(select(.title == env.title))[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Failed again: ${RUN_URL} (attempt ${RUN_ATTEMPT}, started ${RUN_STARTED})."
            echo "Threaded onto existing issue #$existing"
          else
            # Assignment is what sends the notification: an unassigned bot
            # issue reached nobody and #1755 sat unread for four days. If
            # an assignee ever loses access, still file the issue unassigned.
            create() {
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$title" --body "$body" \
                --label automated --label bug \
                --milestone "Backlog — Under watch" "$@"
            }
            create --assignee "$ALARM_ASSIGNEES" || create
            echo "Opened a new alarm issue"
          fi
