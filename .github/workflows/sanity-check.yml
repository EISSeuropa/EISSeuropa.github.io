# Build-sanity guard.
#
# Runs scripts/check-build-sanity.mjs, which fails the build on:
#   - duplicate keys in an object literal in src/_data/*.js (JS silently
#     keeps the last, dropping a value — this broke /2026's programme-PDF
#     buttons, issue #479)
#   - empty or junk href="" / src="" (and literal undefined / null /
#     [object Object]) in the built _site/ (looks interactive but does
#     nothing, or a template read a missing/wrong-typed value — issue #478)
#
# These slip past Eleventy (builds duplicate-key objects without error)
# and the link checker (an empty href is a no-op, not a broken link).
#
# Status: gating. The script exits non-zero on any finding. It passes
# clean on the current tree, so it only ever fires on a real regression.
#
# Mirrors the build + Node setup of link-check.yml. SHA-pinned actions
# per CLAUDE.md §2.
name: Build sanity

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/check-build-sanity.mjs'
      - 'scripts/a11y_lint.py'
      - '.github/workflows/sanity-check.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.eleventy.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    name: Duplicate data keys + empty href/src
    runs-on: ubuntu-latest
    # Caps a hung job at minutes rather than the 6-hour default. Real runs
    # finish in about one minute; this is headroom, not a target.
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Run build-sanity check
        run: node scripts/check-build-sanity.mjs

      # A malformed .bib does not fail the build, it fails in a reader's LaTeX
      # compile weeks later, so it needs its own gate (#1254).
      - name: Run citation-export check
        run: node scripts/check-citations.mjs

      # Static a11y lint over the built site (duplicate ids, missing
      # alt/labels/landmarks, heading gaps — see scripts/a11y_lint.py).
      # Stdlib-only Python, no pip install needed. Gating: the script
      # exits non-zero on any finding (issue #602).
      - name: Run accessibility lint
        run: python3 scripts/a11y_lint.py
