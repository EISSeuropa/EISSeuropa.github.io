# Build-sanity guard.
#
# Runs scripts/check-build-sanity.mjs, which fails the build on:
#   - duplicate keys in an object literal in src/_data/*.js (JS silently
#     keeps the last, dropping a value — this broke /2026's programme-PDF
#     buttons, issue #479)
#   - empty or junk href="" / src="" (and literal undefined / null /
#     [object Object]) in the built _site/ (looks interactive but does
#     nothing, or a template read a missing/wrong-typed value — issue #478)
#
# These slip past Eleventy (builds duplicate-key objects without error)
# and the link checker (an empty href is a no-op, not a broken link).
#
# Status: gating. The script exits non-zero on any finding. It passes
# clean on the current tree, so it only ever fires on a real regression.
#
# Mirrors the build + Node setup of link-check.yml. SHA-pinned actions
# per CLAUDE.md §2.
name: Build sanity

# Deliberately unfiltered (#1343). This used to gate on `paths: [src/**,
# ...]`, which meant 11 of any 40 merged PRs never ran it — mostly the
# bot's own docs/roadmap-2026.md refreshes, but also hand-written PRs
# touching only scripts/ or .claude/. Two reasons it now runs on
# everything. It is the repo's main lint (duplicate data keys, empty and
# junk href/src, the §15 class-collision check, sitemap completeness),
# and tooling outside src/ can break the built output while matching no
# filter. And #501 plans to make checks required on master: a required
# check that never runs sits `pending` forever and blocks the merge
# outright, so every roadmap-auto PR would become unmergeable. The whole
# job takes about a minute, so the filter was not buying anything.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    name: Duplicate data keys + empty href/src
    # ponytail: the `*/auto` refresh PRs merge a second after they open, so this
    # run dies before it dispatches a job and GitHub reports a jobless failure.
    # Skipping gates nothing (the master ruleset requires no status checks, so
    # these never blocked an auto-PR); a bad refresh still trips the `master`
    # push runs, where the failure alarm sees it.
    if: ${{ !endsWith(github.head_ref, '/auto') }}
    runs-on: ubuntu-latest
    # Caps a hung job at minutes rather than the 6-hour default. Real runs
    # finish in about one minute; this is headroom, not a target.
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Run build-sanity check
        run: node scripts/check-build-sanity.mjs

      # A malformed .bib does not fail the build, it fails in a reader's LaTeX
      # compile weeks later, so it needs its own gate (#1254).
      - name: Run citation-export check
        run: node scripts/check-citations.mjs

      # Feeds fail silently too: a reader's app just stops updating. This also
      # guards the rule that a feed's <updated> comes from its content, so the
      # scheduled rebuild cannot notify every subscriber on a timer (#1256).
      - name: Run Atom feed check
        run: python3 scripts/check-feeds.py

      # The Anthology names the editions it declares complete (#1499). That
      # claim goes stale on its own: a newly ingested paper without an
      # abstract, or a change to what counts as eligible, can push a declared
      # edition back under the threshold with a green build.
      - name: Check the declared release scope still holds
        run: node scripts/check-release-scope.mjs

      # The ledger is the only record of when a paper or its abstract landed,
      # so drift means the feeds are dating new material wrongly (#1256).
      - name: Check the corpus ledger is current
        run: node scripts/sync-corpus-ledger.mjs --check

      # Static a11y lint over the built site (duplicate ids, missing
      # alt/labels/landmarks, heading gaps — see scripts/a11y_lint.py).
      # Stdlib-only Python, no pip install needed. Gating: the script
      # exits non-zero on any finding (issue #602).
      - name: Run accessibility lint
        run: python3 scripts/a11y_lint.py
