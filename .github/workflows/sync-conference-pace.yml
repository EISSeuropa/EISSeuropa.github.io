# Daily refresh of src/data/conference-pace.json from Indico (#2101).
#
# What this does
#   - scripts/conference-pace.py --from-indico reads, for each edition in
#     src/_data/conferences.js whose conference is within the next year or
#     began less than a month ago, the date of every abstract and every
#     registration on its Indico event. It keeps only the days before the
#     conference.
#   - Opens a PR on `conference-pace/auto` when a list changed, and merges it
#     once its checks pass. The "Conference pace" card on /internal.html
#     reads the file at the next deploy.
#   - A view the bot cannot read (a missing permission, an expired token)
#     fails the run after the other lists are written, so the failure alarm
#     fires and the rest still lands.
#
# Credential: INDICO_PACE_TOKEN, a read:everything token of the website sync
# bot, which needs the Abstracts and Registration (check-in only)
# permissions on each edition's event. Setup in docs/conference-pace.md.
#
# Adapted from sync-orcid.yml: same SHA-pinned actions and the same
# scripts/merge-bot-pr.sh merge step. 03:20 UTC, before the Indico sync
# (03:45) and the scheduled deploy (04:15).

name: Sync conference pace

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: conference-pace-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Refresh src/data/conference-pace.json from Indico
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Self-check the script
        run: python3 scripts/test-conference-pace.py

      - name: Read abstracts and registrations from Indico
        id: pace
        env:
          INDICO_PACE_TOKEN: ${{ secrets.INDICO_PACE_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/conference-pace.py --from-indico | tee /tmp/pace.txt
          {
            echo "Auto-generated refresh of \`src/data/conference-pace.json\`, read by the \"Conference pace\" card on \`/internal.html\` (#2039, #2101)."
            echo ""
            echo '```'
            cat /tmp/pace.txt
            echo '```'
            echo ""
            echo "Only the days before each conference are kept. No names, titles or emails."
            echo ""
            echo "---"
            echo "_Workflow: **Sync conference pace**, run_id \`${{ github.run_id }}\`, trigger \`${{ github.event_name }}\`._"
          } > /tmp/pace-pr-body.md

      # Runs after a partial failure too, so the lists that were read land.
      - name: Open or update PR if conference-pace.json changed
        id: create-pr
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ secrets.AUTOPR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: conference-pace/auto
          base: master
          delete-branch: true
          add-paths: src/data/conference-pace.json
          title: "data(internal): refresh the conference pace from Indico"
          commit-message: |
            data(internal): refresh the conference pace from Indico

            Auto-generated by scripts/conference-pace.py --from-indico.
          body-path: /tmp/pace-pr-body.md
          labels: |
            automated
            data-sync

      # Merge once the four required checks pass. The "Restrict updates"
      # ruleset blocks auto-merge, so the owner's PAT merges with --admin
      # after the checks (scripts/merge-bot-pr.sh, docs/branch-protection.md).
      - name: Merge once the required checks pass
        if: ${{ !cancelled() && steps.create-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.AUTOPR_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: scripts/merge-bot-pr.sh "${{ steps.create-pr.outputs.pull-request-number }}"
