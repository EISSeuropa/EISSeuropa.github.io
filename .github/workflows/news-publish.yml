# Issue-driven news publishing (#634).
#
# A News item issue (.github/ISSUE_TEMPLATE/news.yml, #2058) becomes a PR that
# adds the item to src/_data/news.json. The run starts in two ways:
#
#   - a publisher files the form: the run starts when the issue is opened;
#   - a publisher applies the `news` label, to an issue someone else filed or
#     to a free-text issue with optional `Type:` / `URL:` / `Date:` lines.
#
# The PR waits for the maintainer, who reads it and merges it. Nothing reaches
# the site, the feed or the social posts before that merge. The PR body carries
# `Closes #<issue>`, so merging it closes the issue.
#
# Publishers are the accounts in the repository variable NEWS_PUBLISHERS
# (GitHub logins, separated by commas, semicolons or spaces). An issue opened by anyone
# else is left for a publisher to label, with no comment. A label applied by
# anyone else gets a comment saying nothing was published. With the variable
# unset, nobody can publish.
#
# Action pins mirror the other workflows (SHA-pinned, CLAUDE.md §2).

name: Publish news from issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # One run per issue, so re-labelling doesn't race itself; different issues
  # run independently.
  group: news-publish-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  publish:
    name: Append the news item and open a PR
    # A form issue starts with its Site field. Any other new issue is ignored.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'news')
      || (github.event.action == 'opened' && startsWith(github.event.issue.body, '### Site'))
    runs-on: ubuntu-latest
    steps:
      - name: Check the publisher
        id: publisher
        env:
          PUBLISHERS: ${{ vars.NEWS_PUBLISHERS }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          allowed=false
          for login in $(echo "$PUBLISHERS" | tr ',;' '  '); do
            if [ "${login,,}" = "${SENDER,,}" ]; then allowed=true; fi
          done
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          if [ "$allowed" != true ]; then
            echo "::notice::$SENDER is not in NEWS_PUBLISHERS. Nothing published."
          fi

      - name: Tell the issue why nothing was published
        if: steps.publisher.outputs.allowed != 'true' && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body \
            "@$SENDER applied \`news\`, but only the accounts in the NEWS_PUBLISHERS repository variable can publish. Nothing was published. A publisher can remove and re-apply the label."

      - name: Check out repository
        if: steps.publisher.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: steps.publisher.outputs.allowed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Append the news item
        if: steps.publisher.outputs.allowed == 'true'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -o pipefail
          export TODAY="$(date -u +%F)"
          python3 scripts/news-from-issue.py | tee /tmp/news-add.txt
          {
            echo "Generated from issue #${ISSUE_NUMBER}, filed by @${ISSUE_AUTHOR}."
            echo ""
            echo "Script output:"
            echo ""
            echo '```'
            cat /tmp/news-add.txt
            echo '```'
            echo ""
            echo "The item was added to \`src/_data/news.json\`. Merging this PR publishes it"
            echo "on the homepage, the \`/news\` archive and the Atom feed, and queues the"
            echo "LinkedIn and Bluesky posts for approval in the \`social\` environment."
            echo "To change anything first, edit the entry on this branch."
            echo ""
            echo "Closes #${ISSUE_NUMBER}"
          } > /tmp/news-pr-body.md

      - name: Open or update the news PR
        if: steps.publisher.outputs.allowed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.AUTOPR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: news/auto-${{ github.event.issue.number }}
          base: master
          delete-branch: true
          title: 'content(news): ${{ github.event.issue.title }}'
          commit-message: |
            content(news): publish item from issue #${{ github.event.issue.number }}

            Appended to src/_data/news.json by scripts/news-from-issue.py.
          body-path: /tmp/news-pr-body.md
          labels: |
            automated
