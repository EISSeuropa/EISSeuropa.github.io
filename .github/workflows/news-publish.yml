# Issue-driven news publishing (#634).
#
# Label an issue `news` and this workflow turns it into a post: it runs
# scripts/news-from-issue.py to append an item to src/_data/news.json, then
# opens the standard auto-PR, merged once the required checks pass. The issue is
# either the News item form (.github/ISSUE_TEMPLATE/news.yml, #2058) or free
# text with optional `Type:` / `URL:` / `Date:` header lines. The PR body
# carries `Closes #<issue>`, so merging it closes the issue.
#
# Only the accounts listed in the repository variable NEWS_PUBLISHERS
# (GitHub logins, separated by commas or spaces) can publish (#2058). When
# anyone else applies the label, the run comments on the issue and stops.
# With the variable unset, nobody can publish.
#
# The maintainer publishes by filing a labelled issue from a phone — the
# two-minute path #634 asks for. Sits on top of the News surface (#96) and
# the Atom feed (#605), which both read news.json.
#
# Action pins mirror the other workflows (SHA-pinned, CLAUDE.md §2).

name: Publish news from issue

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # One run per issue, so re-labelling doesn't race itself; different issues
  # run independently.
  group: news-publish-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  publish:
    name: Append the news item and open an auto-PR
    if: github.event.label.name == 'news'
    runs-on: ubuntu-latest
    steps:
      - name: Check the publisher
        id: publisher
        env:
          PUBLISHERS: ${{ vars.NEWS_PUBLISHERS }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          allowed=false
          for login in $(echo "$PUBLISHERS" | tr ',' ' '); do
            if [ "${login,,}" = "${SENDER,,}" ]; then allowed=true; fi
          done
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          if [ "$allowed" != true ]; then
            echo "::notice::$SENDER is not in NEWS_PUBLISHERS. Nothing published."
          fi

      - name: Tell the issue why nothing was published
        if: steps.publisher.outputs.allowed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body \
            "@$SENDER applied \`news\`, but only the accounts in the NEWS_PUBLISHERS repository variable can publish. Nothing was published. A publisher can remove and re-apply the label."

      - name: Check out repository
        if: steps.publisher.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: steps.publisher.outputs.allowed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Append the news item
        if: steps.publisher.outputs.allowed == 'true'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -o pipefail
          export TODAY="$(date -u +%F)"
          python3 scripts/news-from-issue.py | tee /tmp/news-add.txt
          {
            echo "Auto-generated from issue #${ISSUE_NUMBER} (labelled \`news\`)."
            echo ""
            echo "Script output:"
            echo ""
            echo '```'
            cat /tmp/news-add.txt
            echo '```'
            echo ""
            echo "The item was appended to \`src/_data/news.json\`; it surfaces"
            echo "on the homepage \"Latest\" section, the \`/news\` archive, and"
            echo "the Atom feed. Edit the JSON entry in this PR to tweak the"
            echo "headline, excerpt, type, link, or date before merging."
            echo ""
            echo "Closes #${ISSUE_NUMBER}"
          } > /tmp/news-pr-body.md

      - name: Open or update the news PR
        if: steps.publisher.outputs.allowed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.AUTOPR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: news/auto-${{ github.event.issue.number }}
          base: master
          delete-branch: true
          title: 'content(news): ${{ github.event.issue.title }}'
          commit-message: |
            content(news): publish item from issue #${{ github.event.issue.number }}

            Appended to src/_data/news.json by scripts/news-from-issue.py.
          body-path: /tmp/news-pr-body.md
          labels: |
            automated

      # Merge once the four required checks pass. The "Restrict updates"
      # ruleset blocks auto-merge, so the owner's PAT merges with --admin
      # after the checks (scripts/merge-bot-pr.sh, docs/branch-protection.md).
      - name: Merge once the required checks pass
        # A title starting `[test]` opens the PR but leaves it unmerged, so
        # the pipeline can be checked without publishing. Close the PR after.
        if: steps.publisher.outputs.allowed == 'true' && steps.create-pr.outputs.pull-request-number && !startsWith(github.event.issue.title, '[test]')
        env:
          GH_TOKEN: ${{ secrets.AUTOPR_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: scripts/merge-bot-pr.sh "${{ steps.create-pr.outputs.pull-request-number }}"
