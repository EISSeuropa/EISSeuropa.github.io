# Issue-driven news publishing (#634).
#
# A News item issue (.github/ISSUE_TEMPLATE/news.yml, #2058) becomes a PR that
# adds the item to src/_data/news.json. The run starts in two ways:
#
#   - a publisher files the form: the run starts when the issue is opened;
#   - a publisher edits an open form issue: the run starts again and the
#     news PR is rebuilt from the edited form (an edit by anyone else starts
#     nothing, and a closed issue, whose item has merged, is left alone);
#   - a publisher applies the `news` label, to an issue someone else filed or
#     to a free-text issue with optional `Type:` / `URL:` / `Date:` lines.
#
# The PR waits for the maintainer or an account in NEWS_APPROVERS, who reads it
# and merges it (news-merge.yml). The PR is assigned to those accounts, so
# GitHub notifies them (#2135). Nothing reaches the site, the feed or the
# social posts before that merge. The PR body carries `Closes #<issue>`, so
# merging it closes the issue.
#
# A run that fails says so on the issue, with a link to the run (#2134). When
# the script stopped on the form's content (an empty or too long headline, a
# too long summary), the comment quotes its reason and says how to try again.
#
# Publishers are the accounts in the repository variable NEWS_PUBLISHERS
# (GitHub logins, separated by commas, semicolons or spaces). An issue opened by anyone
# else is left for a publisher to label, with no comment. A label applied by
# anyone else gets a comment saying nothing was published. With the variable
# unset, nobody can publish.
#
# Action pins mirror the other workflows (SHA-pinned, CLAUDE.md §2).

name: Publish news from issue

on:
  issues:
    types: [opened, labeled, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # One run per issue, so re-labelling doesn't race itself; different issues
  # run independently.
  group: news-publish-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  publish:
    name: Append the news item and open a PR
    # A form issue starts with its Site field. Any other new issue is ignored.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'news')
      || (github.event.action == 'opened' && startsWith(github.event.issue.body, '### Site'))
      || (github.event.action == 'edited' && github.event.issue.state == 'open'
          && startsWith(github.event.issue.body, '### Site'))
    runs-on: ubuntu-latest
    steps:
      # The labels this pipeline listens for, made here so nobody has to make
      # them by hand and a deleted one comes back (#2142). An existing label
      # makes `gh label create` fail, which is the expected case.
      - name: Create the news and publish labels if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create news --color 0e8a16 --description "Publishes a News item issue as a PR" 2>/dev/null || true
          gh label create publish --color 1d76db --description "Merges a news or board profile PR (news-merge.yml)" 2>/dev/null || true

      - name: Check the publisher
        id: publisher
        env:
          PUBLISHERS: ${{ vars.NEWS_PUBLISHERS }}
          APPROVERS: ${{ vars.NEWS_APPROVERS }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          # Comma-separated, as the PR step's `assignees` takes them.
          echo "approvers=$(echo "$APPROVERS" | tr -s ';, ' ',' | sed 's/^,//; s/,$//')" >> "$GITHUB_OUTPUT"
          allowed=false
          for login in $(echo "$PUBLISHERS" | tr ',;' '  '); do
            if [ "${login,,}" = "${SENDER,,}" ]; then allowed=true; fi
          done
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          if [ "$allowed" != true ]; then
            echo "::notice::$SENDER is not in NEWS_PUBLISHERS. Nothing published."
          fi

      - name: Tell the issue why nothing was published
        if: steps.publisher.outputs.allowed != 'true' && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body \
            "@$SENDER applied \`news\`, but only the accounts in the NEWS_PUBLISHERS repository variable can publish. Nothing was published. A publisher can remove and re-apply the label."

      - name: Check out repository
        if: steps.publisher.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: steps.publisher.outputs.allowed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Pillow shrinks the item's photo (scripts/requirements.txt).
      - name: Install the script requirements
        if: steps.publisher.outputs.allowed == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Append the news item
        if: steps.publisher.outputs.allowed == 'true'
        id: append
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -o pipefail
          export TODAY="$(date -u +%F)"
          # stderr holds the reason a run stops, written for the person who
          # filed the form. The failure step posts it on the issue.
          python3 scripts/news-from-issue.py 2>/tmp/news-error.txt | tee /tmp/news-add.txt \
            || { cat /tmp/news-error.txt >&2; exit 1; }
          {
            echo "Generated from issue #${ISSUE_NUMBER}, filed by @${ISSUE_AUTHOR}."
            echo ""
            echo "Script output:"
            echo ""
            echo '```'
            cat /tmp/news-add.txt
            echo '```'
            echo ""
            if grep -q 'photo saved as' /tmp/news-add.txt; then
              echo "The photo is in the Files changed tab. The post preview below gives its description, read aloud to people who cannot see it."
              echo ""
            elif ! grep -q 'already present' /tmp/news-add.txt; then
              echo "No photo: the posts use the standard EISS picture. To add a photo, a publisher edits issue #${ISSUE_NUMBER} and drags it into the Image box, which rebuilds this PR."
              echo ""
            fi
            echo "The item was added to \`src/_data/news.json\`. Merging this PR publishes it"
            echo "on the homepage, the \`/news\` archive and the Atom feed, and posts it to"
            echo "LinkedIn and Bluesky straight away, as previewed in the comment below."
            echo "To change anything first, edit the entry on this branch."
            echo ""
            echo "Closes #${ISSUE_NUMBER}"
          } > /tmp/news-pr-body.md

      # The form's "Add a title" box mostly stays "news:", so the issue takes
      # the headline's name. GITHUB_TOKEN's edit starts no new run.
      - name: Name the issue after the headline
        if: steps.publisher.outputs.allowed == 'true' && steps.append.outputs.headline != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEADLINE: ${{ steps.append.outputs.headline }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          want="news: $HEADLINE"
          if [ "$TITLE" != "$want" ]; then
            gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --title "$want"
          fi

      - name: Open or update the news PR
        if: steps.publisher.outputs.allowed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ secrets.AUTOPR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: news/auto-${{ github.event.issue.number }}
          base: master
          delete-branch: true
          title: 'content(news): ${{ steps.append.outputs.headline || github.event.issue.title }}'
          commit-message: |
            content(news): publish item from issue #${{ github.event.issue.number }}

            Appended to src/_data/news.json by scripts/news-from-issue.py.
          body-path: /tmp/news-pr-body.md
          assignees: ${{ steps.publisher.outputs.approvers }}
          labels: |
            automated

      - name: Tell the issue that the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDER: ${{ github.event.sender.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A crash (a traceback) or a fault in the repository (a message
          # prefixed "news-from-issue:") gets the generic message instead.
          if [ -s /tmp/news-error.txt ] && ! grep -q -e Traceback -e '^news-from-issue:' /tmp/news-error.txt; then
            body="@$SENDER nothing was published. $(cat /tmp/news-error.txt)

          To edit the issue, open the ··· menu at the top right of its first message and choose Edit. Saving the edit starts a new run when a publisher makes it. Otherwise a publisher removes the \`news\` label and applies it again. The run: $RUN_URL"
          else
            body="@$SENDER the run that turns this issue into a news PR failed, so nothing was published. The maintainer has been notified. The run: $RUN_URL"
          fi
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$body"
