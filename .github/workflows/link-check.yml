# Broken-link check.
#
# Runs scripts/check-links.sh against the built `_site/` on:
#   - every PR touching files that affect the built output (catches a
#     bad link before merge once we flip to gating mode, see below)
#   - weekly on master (catches external link rot; academic and
#     COST URLs sometimes shuffle, and we want to hear about it
#     within a week rather than weeks later when a visitor reports
#     it)
#   - manual dispatch from the Actions tab
#
# Status: **gating**. The script exits non-zero on any broken link
# (internal or external) and the workflow fails accordingly. The
# pre-existing untranslated-page nav-synthesis breakage that gated
# this workflow as advisory in PR #164 was resolved by #162's
# `localizedHref` filter, and the script now reports 0 broken links
# across all 1500+ internal references.
#
# Adapted from the sister repo
# EISSeuropa/netsec.github.io/.github/workflows/launch-qa-link-check.yml.
# Two adaptations: needs a Node + Eleventy build step to produce
# `_site/` before the script can walk it; cron sequence moves to
# 07:00 UTC Monday so it doesn't collide with the 06:00 sync-roadmap.
name: Link check

on:
  pull_request:
    # Kept filtered, unlike sanity-check (#1343): this one reaches
    # third-party servers, so running it on a .github-only PR buys
    # nothing and costs someone else's bandwidth. Widened to docs and
    # markdown, which do carry links. Because it stays filtered it must
    # not join the #501 required-check set without a "skipped but
    # required" shim, or a docs-free PR would hang pending on it.
    paths:
      - 'src/**'
      - 'docs/**'
      - '**.md'
      - 'scripts/check-links.sh'
      - 'scripts/test-check-links.py'
      - '.github/workflows/link-check.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.eleventy.js'
  schedule:
    # Weekly on Mondays at 07:00 UTC. After the 06:00 sync-roadmap
    # belt-and-braces; before workhours in Europe so a Monday-morning
    # external rot report lands at the start of the maintainer's week.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Resolve every internal + external link in `_site/`
    runs-on: ubuntu-latest
    # Caps a hung job at minutes rather than the 6-hour default. Real runs
    # finish in about one minute; this is headroom, not a target.
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The checker's own self-check, before it is trusted to judge 700-odd
      # links. Two seconds, no dependencies, and it pins the behaviours that
      # would otherwise be re-derived by growing SKIP_HOSTS: a 429 and a
      # hanging host are reported, a 404 still fails.
      - name: Self-check the link checker
        run: python3 scripts/test-check-links.py

      - name: Run link check
        run: ./scripts/check-links.sh --quiet
