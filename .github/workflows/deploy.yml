# Build and deploy site to GitHub Pages.
#
# Triggers on push-to-master, on PR-into-master (for build validation),
# and via manual dispatch from the Actions tab.
#
# Known gotcha: GitHub Actions intentionally does NOT cascade workflow
# runs when a workflow's GITHUB_TOKEN does the merging. So if a PR is
# merged via `gh pr merge --auto --squash` and that auto-merge is
# resolved by the same GITHUB_TOKEN that opened the PR (e.g. the
# sync-roadmap auto-PR loop), this workflow does NOT fire on the
# resulting master push. Symptom: master has new commits, the live
# site is stale. Diagnosis: `gh run list --workflow=deploy.yml --limit
# 5` shows no run at the timestamp of the merge. Cure: push any commit
# manually (an empty commit works) or run this workflow via
# `gh workflow run deploy.yml --ref master` from a real user account.
#
# Second known gotcha, same symptom, different cause (#1261). This
# workflow used to put every run in one `pages` concurrency group with
# `cancel-in-progress: false`, including `pull_request` runs that can
# never deploy anything (both the artifact upload and the deploy job are
# gated on `github.event_name != 'pull_request'`). So a PR validation
# build and a real production deploy queued against each other. When a
# run on a bot branch stalled at `action_required` — the roadmap-progress
# auto-PR does this, and nobody ever approves those runs — it held the
# group and later runs stacked up behind it with zero jobs scheduled,
# uncancellable (the API returns 409 on both cancel and force-cancel).
# Cure, now in place: PR runs get their own per-branch group and
# supersede themselves; only real deploys use `pages`, and those still
# never cancel in flight, because two concurrent Pages deployments must
# not race.

name: Build and deploy site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Real deploys (push, workflow_dispatch) share the single `pages` group and
  # never cancel in flight. PR validation builds get a group per head branch
  # and do cancel, so a second push to a branch supersedes the first instead
  # of queueing behind it. Keeping the two apart is the fix for #1261.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.head_ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # ponytail: the `*/auto` refresh PRs merge a second after they open, so this
    # run dies before it dispatches a job and GitHub reports a jobless failure.
    # Skipping gates nothing (the master ruleset requires no status checks, so
    # these never blocked an auto-PR); a bad refresh still trips the `master`
    # push runs, where the failure alarm sees it.
    if: ${{ !endsWith(github.head_ref, '/auto') }}
    runs-on: ubuntu-latest
    # Caps a hung job at minutes rather than the 6-hour default. Real runs
    # finish in about one minute; this is headroom, not a target.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the sitemap can carry a real per-page <lastmod>
          # (#620). The default shallow checkout makes `git log` report the
          # checkout commit for every file, so every page would claim to have
          # changed today, on every build. The build detects shallowness and
          # omits the element rather than emitting that, so without this line
          # the feature silently does nothing rather than lying.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "20"

      - run: npm install --no-audit --no-fund

      - run: npm run build

      # Build the static search index. Pagefind crawls the rendered
      # _site/ HTML and writes wasm + index shards to _site/pagefind/,
      # which the lazy import in assets/js/search.js loads at runtime.
      # Runs after Eleventy so it sees the final HTML. The index is built
      # here only, never committed (_site is gitignored), so local dev
      # has no index and the search modal degrades gracefully.
      #
      # Pinned to 1.5.2 (matching the NetSec sister repo): an unpinned
      # `npx pagefind` can fetch a different version on each deploy, and
      # the index format / content-hashed shard names differ between
      # versions — across rapid back-to-back deploys the CDN can then
      # serve a mix of shards from two versions, which surfaces as some
      # queries returning no results. Pinning keeps every build identical.
      - name: Build search index (Pagefind)
        run: npx -y pagefind@1.5.2 --site _site

      - name: List build output
        run: |
          echo "=== _site root ==="
          ls -la _site/ | head -60
          echo "=== _site/.well-known ==="
          ls -la _site/.well-known/ 2>&1 || echo "MISSING"
          echo "=== root-level HTML count ==="
          find _site -maxdepth 1 -name '*.html' | wc -l
          echo "=== critical files ==="
          for f in CNAME .nojekyll robots.txt sitemap.xml index.html .well-known/apple-developer-merchantid-domain-association assets/images/index-meta.jpg; do
            if [ -e "_site/$f" ]; then echo "OK   $f"; else echo "MISS $f"; fi
          done

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Caps a hung job at minutes rather than the 6-hour default. Real runs
    # finish in about one minute; this is headroom, not a target.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
