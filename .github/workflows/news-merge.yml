# Merge a news or board profile PR by applying the `publish` label.
#
# The "Restrict updates" ruleset lets only the owner update master, and the
# owner's bypass is not offered in the GitHub mobile app. Applying `publish`
# to a PR hands the merge to scripts/merge-bot-pr.sh, which waits for the four
# required checks and merges with the owner's AUTOPR_TOKEN, as the sync bots
# do (docs/branch-protection.md). It also lets a second reader approve these
# two kinds of PR without the owner's login (#2135).
#
# The files a PR changes decide its kind, and each kind has its own
# repository variable of approvers (GitHub logins, separated by commas):
#   - src/_data/news.json and nothing else: NEWS_APPROVERS;
#   - src/_data/board.json and files in src/assets/images/board/, and nothing
#     else (the PR of sync-board.yml): PROFILE_APPROVERS.
# An unset variable means the repository owner. The run merges only when the
# label comes from an approver of the PR's kind. Otherwise it comments on the
# PR and removes the label. A merge that fails does the same, with a link to
# the run (#2134).
#
# The first step runs before the checkout, so it never runs code from the PR.
# scripts/test-news-merge.py lifts its shell out of this file and checks it.
#
# A news merge then starts social-post.yml as usual.
#
# Action pins mirror the other workflows (SHA-pinned, CLAUDE.md §2).

name: Merge a data PR on the publish label

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: news-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    name: Check and merge
    if: >-
      github.event.label.name == 'publish'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check the approver and the changed files
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          NEWS_APPROVERS: ${{ vars.NEWS_APPROVERS || github.repository_owner }}
          PROFILE_APPROVERS: ${{ vars.PROFILE_APPROVERS || github.repository_owner }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          reason=""
          files=$(gh pr view "$PR" --repo "$REPO" --json files --jq '.files[].path' | sort -u)
          # grep -v finds a file outside the kind's list. No such file: that kind.
          if [ -z "$files" ]; then
            reason="This PR changes no file, so the \`publish\` label cannot merge it."
          elif ! grep -qvx 'src/_data/news\.json' <<<"$files"; then
            variable=NEWS_APPROVERS
          elif ! grep -qvEx 'src/_data/board\.json|src/assets/images/board/[^/]+' <<<"$files"; then
            variable=PROFILE_APPROVERS
          else
            reason="The \`publish\` label merges a PR that changes only \`src/_data/news.json\`, or only \`src/_data/board.json\` and headshots in \`src/assets/images/board/\`. This PR changes other files, so merge it from the merge box instead. Changed files: $(echo "$files" | tr '\n' ' ')"
          fi
          if [ -z "$reason" ]; then
            allowed=false
            for login in $(echo "${!variable}" | tr ',;' '  '); do
              if [ "${login,,}" = "${SENDER,,}" ]; then allowed=true; fi
            done
            if [ "$allowed" != true ]; then
              reason="@$SENDER applied \`publish\`, but only the accounts in $variable can merge this PR that way."
            fi
          fi
          if [ -n "$reason" ]; then
            gh pr comment "$PR" --repo "$REPO" --body "$reason Nothing was merged."
            gh pr edit "$PR" --repo "$REPO" --remove-label publish || true
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Merge once the required checks pass
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOPR_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: scripts/merge-bot-pr.sh "${{ github.event.pull_request.number }}"

      - name: Tell the PR that the merge failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "The \`publish\` label did not merge this PR. The run shows why: $RUN_URL. Nothing was merged. Apply the label again once the cause is fixed."
          gh pr edit "$PR" --repo "$REPO" --remove-label publish || true
