# Show the LinkedIn and Bluesky posts of a news PR before it merges.
#
# Every PR that changes src/_data/news.json gets one comment, updated on each
# push, with the exact text scripts/social-post.py would post once the PR
# merges and the run is approved in the `social` environment
# (social-post.yml). The maintainer reads the item and its posts in one place
# before merging. This workflow posts nothing and holds no secrets.
#
# The comment is found by its first line, <!-- news-social-preview -->.
#
# Action pins mirror the other workflows (SHA-pinned, CLAUDE.md §2).

name: Preview the social posts of a news PR

on:
  pull_request:
    paths:
      - 'src/_data/news.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: news-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Comment the post preview
    # A fork PR gets a read-only token, so it cannot comment.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Fold in a ledger that has not reached master yet
        run: bash scripts/social-fold-ledger.sh

      - name: Write or update the preview comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ENABLED: ${{ vars.SOCIAL_ENABLED }}
        run: |
          set -euo pipefail
          marker='<!-- news-social-preview -->'
          {
            echo "$marker"
            echo "### LinkedIn and Bluesky preview"
            echo ""
            if [ "$ENABLED" = "true" ]; then
              echo "After this PR merges, these posts wait for approval in the \`social\` environment, then go out as shown."
            else
              echo "\`SOCIAL_ENABLED\` is not \`true\`, so nothing is posted after the merge."
            fi
            echo ""
            echo '```'
            python3 scripts/social-post.py --dry-run
            echo '```'
          } > /tmp/news-preview.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@/tmp/news-preview.md > /dev/null
            echo "Updated comment $id."
          else
            gh pr comment "$PR" --repo "$REPO" --body-file /tmp/news-preview.md
          fi
