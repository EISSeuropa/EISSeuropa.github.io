name: News item
description: A news item for the website, the feed and the LinkedIn and Bluesky posts.
title: "news: "
body:
  - type: markdown
    attributes:
      value: |
        Fill in this form to announce something on eiss-europa.com, LinkedIn and Bluesky.

        After you submit it, a robot turns the form into a draft. Nothing is public until the maintainer approves that draft. If something goes wrong, the robot leaves a comment on this issue saying what to change.

        Headline and Summary are required. Leave any other field blank if it does not apply. Write plain text everywhere: no links, no bold, no hashtags copied from LinkedIn. The web address goes in the Link field, and a photo in the Image field.

        The "Add a title" box at the top only names this request on GitHub, so the team can find it in the list of issues. It does not appear on the website or in the posts, and you can leave it as "news:". The Headline field below is the title readers see.
  - type: dropdown
    id: site
    attributes:
      label: Site
      description: >-
        Who the news is from. Pick "EISS" for EISS news, or "Joint (EISS and
        NetSec)" for something EISS organises with NetSec. For news from
        NetSec alone, do not use this form: ask the maintainer.
      options:
        - EISS
        - Joint (EISS and NetSec)
        - NetSec
      default: 0
    validations:
      required: true
  - type: input
    id: headline
    attributes:
      label: Headline
      description: >-
        The title readers see, up to 100 characters. It is the title of the item
        on the website and the first line of the LinkedIn and Bluesky posts. Example: "ESSC 2027: the call for papers is open".
      placeholder: "ESSC 2027: the call for papers is open"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: >-
        One or two sentences, up to 300 characters including spaces. It appears
        under the headline on the website and is the text of the LinkedIn and
        Bluesky posts. A longer summary stops the robot, which then asks you to
        shorten it.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: >-
        The label shown next to the item on the website. "event" is for a
        conference, workshop, call or deadline, "paper" for a publication,
        "press" for media coverage, "podcast" for an episode, and "news" for
        anything else.
      options:
        - news
        - event
        - paper
        - press
        - podcast
      default: 0
    validations:
      required: false
  - type: input
    id: link
    attributes:
      label: Link
      description: >-
        Optional. The web address of a page that already exists, such as the
        event page or the paper. The headline on the website links to it, and
        the LinkedIn and Bluesky posts end with it. Copy the full address from
        your browser, starting with https://. Leave it blank if there is no
        page: the posts then link to the item on the website.
      placeholder: "https://eiss-europa.com/2027.html"
    validations:
      required: false
  - type: textarea
    id: image
    attributes:
      label: Image
      description: >-
        Optional. A photo for the LinkedIn and Bluesky posts. Drag the photo
        from your computer into this box, or tap the box and paste it on a
        phone, then wait until a line starting with "<img" or "![" appears.
        Use a JPEG or PNG. A large photo is made smaller for you. Use only a
        photo EISS may publish, and ask the people who can be recognised in it
        first. Leave the box empty to use the standard EISS picture. The
        website does not show the photo.
    validations:
      required: false
  - type: input
    id: image-description
    attributes:
      label: Image description
      description: >-
        Needed when you add a photo. One sentence saying what the photo shows,
        up to 300 characters. Screen readers read it aloud to people who
        cannot see the photo. Example: "Four speakers seated at a panel table
        in front of a projected slide."
    validations:
      required: false
  - type: input
    id: date
    attributes:
      label: Publication date
      description: >-
        Optional. The date shown on the item, written year-month-day with
        dashes, for example 2026-11-08. Leave it blank to use today's date.
      placeholder: "2026-11-08"
    validations:
      required: false
  - type: dropdown
    id: collaborator
    attributes:
      label: Collaborator page
      description: >-
        Pick "NetSec" if NetSec's LinkedIn page should be added to the LinkedIn
        post as a collaborator. The maintainer adds it by hand after the post
        goes out. Otherwise keep "No collaborator".
      options:
        - No collaborator
        - NetSec
      default: 0
    validations:
      required: false
