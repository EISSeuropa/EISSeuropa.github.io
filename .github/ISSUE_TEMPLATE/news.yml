name: News item
description: A news item for the website, the feed and the LinkedIn and Bluesky posts.
title: "news: "
body:
  - type: markdown
    attributes:
      value: |
        Fill in this form to announce something on eiss-europa.com, LinkedIn and Bluesky.

        After you submit it, a robot turns the form into a draft. You do not need to add a label. Nothing is public until the maintainer approves that draft. If something goes wrong, the robot leaves a comment on this issue saying what to change.

        Headline, Website summary and Post on are required (or "Do not post" under Options, at the end, for an item on the website only). Leave any other field blank if it does not apply. The website, LinkedIn and Bluesky each get their own text: write the website summary plainly, and the posts the way you would write them on each network. The web address goes in the Link field, and a photo in the Image field.

        Every box has a length limit, given in its description. GitHub does not count the characters as you type, so the robot checks them after you submit and tells you which box to shorten.

        The "Add a title" box at the top only names this request on GitHub. You can leave it as "news:": the robot renames the issue after your headline. The Headline field below is the title readers see.
  - type: dropdown
    id: site
    attributes:
      label: Site
      description: >-
        Who the news is from. Pick "EISS" for EISS news, or "Joint (EISS and
        NetSec)" for something EISS organises with NetSec. A joint item that
        goes to LinkedIn needs NetSec as Collaborator page, below. News from
        NetSec alone goes in the NetSec repository's form.
      options:
        - EISS
        - Joint (EISS and NetSec)
      default: 0
    validations:
      required: true
  - type: input
    id: headline
    attributes:
      label: Headline
      description: >-
        The title readers see, up to 100 characters. It is the title of the item
        on the website, and the first line of a LinkedIn or Bluesky post whose
        box below is left empty. Example: "ESSC 2027: the call for papers is
        open".
      placeholder: "ESSC 2027: the call for papers is open"
    validations:
      required: true
  - type: textarea
    id: website-summary
    attributes:
      label: Website summary
      description: >-
        One or two plain sentences for the website, up to 300 characters
        including spaces. They appear under the headline on the homepage and
        on the news page. No emojis, tags or links: the web address goes in
        the Link field.
    validations:
      required: true
  - type: checkboxes
    id: networks
    attributes:
      label: Post on
      description: >-
        Tick where the news is posted. Tick at least one, unless the item is
        for the website only (Options, at the end): with none ticked, the
        robot stops and asks you to tick one. The website shows the item
        either way. The box of a network left unticked is ignored.
      options:
        - label: LinkedIn
        - label: Bluesky
  - type: textarea
    id: linkedin-post
    attributes:
      label: LinkedIn post
      description: >-
        Optional. The post exactly as it should appear on LinkedIn, up to 3,000
        characters. Line breaks, emojis and hashtags are kept. Only the first
        two or three lines show before "see more", so start with the news. To
        tag a page, write @EISS, @NetSec or @COST. A post copied from
        LinkedIn can be pasted as it is: a link to one of those pages becomes
        its tag, and any other link its plain name. The Link is added at the
        end unless the post already holds it. Leave it empty to post the
        headline, the website summary and the link.
      render: text
    validations:
      required: false
  - type: textarea
    id: bluesky-post
    attributes:
      label: Bluesky post
      description: >-
        Optional. The post exactly as it should appear on Bluesky, up to 300
        characters, and the link counts. The Link is added at the end unless
        the post already holds it, and a tag is written out as the account's
        Bluesky name (@NetSec becomes @netsec-cost.eu), so leave room for both.
        Tags are written @EISS, @NetSec or @COST. Leave it empty to post the
        headline, the website summary and the link, shortened to fit.
      render: text
    validations:
      required: false
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: >-
        The label shown next to the item on the website. "event" is for a
        conference, workshop, call or deadline, "paper" for a publication,
        "press" for media coverage, "podcast" for an episode, and "news" for
        anything else.
      options:
        - news
        - event
        - paper
        - press
        - podcast
      default: 0
    validations:
      required: false
  - type: input
    id: link
    attributes:
      label: Link
      description: >-
        Optional. The web address of a page that already exists, such as the
        event page or the paper. The headline on the website links to it, and
        the LinkedIn and Bluesky posts end with it. Copy the full address from
        your browser, starting with https://. Anything else stops the robot.
        Leave it blank if there is no page: the posts then link to the item on
        the website.
      placeholder: "https://eiss-europa.com/2027.html"
    validations:
      required: false
  - type: textarea
    id: image
    attributes:
      label: Image
      description: >-
        Optional. A photo for the LinkedIn and Bluesky posts. Drag the photo
        from your computer into this box, or tap the box and paste it on a
        phone, then wait until a line starting with "<img" or "![" appears.
        Use a JPEG or PNG. A large photo is made smaller for you. Use only a
        photo EISS may publish, and ask the people who can be recognised in it
        first. Leave the box empty to use the standard EISS picture. The
        website does not show the photo.
    validations:
      required: false
  - type: input
    id: image-description
    attributes:
      label: Image description
      description: >-
        Needed when you add a photo. One sentence saying what the photo shows,
        up to 300 characters. Screen readers read it aloud to people who
        cannot see the photo. Example: "Four speakers seated at a panel table
        in front of a projected slide."
    validations:
      required: false
  - type: input
    id: date
    attributes:
      label: Publication date
      description: >-
        Optional. The date shown on the item, written year-month-day with
        dashes, for example 2026-11-08. Another format stops the robot. Leave
        it blank to use today's date.
      placeholder: "2026-11-08"
    validations:
      required: false
  - type: dropdown
    id: collaborator
    attributes:
      label: Collaborator page
      description: >-
        Pick "NetSec" if NetSec's LinkedIn page should be added to the LinkedIn
        post as a collaborator. Required when the Site is Joint and LinkedIn is
        ticked. The maintainer adds it by hand after the post goes out.
        Otherwise keep "No collaborator".
      options:
        - No collaborator
        - NetSec
      default: 0
    validations:
      required: false
  - type: checkboxes
    id: options
    attributes:
      label: Options
      description: >-
        Tick the box for an item that should appear on the website only, for
        example one already announced on LinkedIn and Bluesky. Leave Post on
        unticked then.
      options:
        - label: Do not post to LinkedIn and Bluesky
          required: false
